# Configuration gitleaks pour FemiGlow.
# Référence : https://github.com/gitleaks/gitleaks
# Lance localement via le hook husky `.husky/pre-commit` ou en CI dans
# `.github/workflows/security.yml`.

[extend]
# On part des règles par défaut puis on ajoute les patterns FemiGlow.
useDefault = true

[[rules]]
id = "femiglow-admin-session-password"
description = "ADMIN_SESSION_PASSWORD plain"
regex = '''ADMIN_SESSION_PASSWORD\s*=\s*["']?[A-Za-z0-9+/=]{32,}["']?'''
tags = ["secret", "femiglow"]

[[rules]]
id = "femiglow-webhook-secret-key"
description = "WEBHOOK_SECRET_KEY plain"
regex = '''WEBHOOK_SECRET_KEY\s*=\s*["']?[A-Za-z0-9+/=]{32,}["']?'''
tags = ["secret", "femiglow"]

[[rules]]
id = "femiglow-cron-secret"
description = "CRON_SECRET plain"
regex = '''CRON_SECRET\s*=\s*["']?[A-Za-z0-9+/=]{16,}["']?'''
tags = ["secret", "femiglow"]

[[rules]]
id = "femiglow-database-url"
description = "Postgres connection string with password"
regex = '''postgres(?:ql)?://[^:\s]+:[^@\s]+@[^/\s]+'''
tags = ["secret", "femiglow"]

[allowlist]
description = "Faux secrets utilisés dans la doc et les tests"
paths = [
  '''(.*?)(\.lock|\.lockb|pnpm-lock\.yaml)''',
  '''docs/admin/specifications/.*\.md''',
  '''docs/dossier-chat-v2/.*''',
  '''docs/audit/.*''',
  '''docs/i18n-strategy-2026-05/.*''',
  '''docs/i18n-content-2026-05/.*''',
  '''docs/checkout-leads-background-2026-06-01/.*''',
  '''docs/owbs-ui-test-battery-2026-06-02/.*''',
  '''.*/__fixtures__/.*''',
  '''.*\.example$''',
  '''\.gitleaks\.toml''',
]
regexes = [
  '''USER:PASSWORD@ep-xxx''',
  '''argon2id\$.*PASS''',
  '''placeholder''',
  # Postgres ephemere de CI/e2e (user=pass=postgres, host=localhost) — non secret.
  '''postgres(?:ql)?://postgres:postgres@localhost''',
  # URLs d'exemple de bases de TEST dans la doc (password=test, host=localhost
  # ou testcontainers, db=femiglow_test) — placeholders, non secrets.
  '''postgres(?:ql)?://[^:\s]+:test@''',
]

# ============================================================================
# 5. PATTERNS AVANCÉS
# ============================================================================

advanced_patterns:

  # ICU plural rules
  plural_examples:
    fr:
      cart_items_count: "{count, plural, =0 {Panier vide} =1 {1 article} other {# articles}}"
    ar:
      cart_items_count: "{count, plural, =0 {السلة فارغة} =1 {منتج واحد} =2 {منتجان} few {# منتجات} many {# منتجاً} other {# منتج}}"
    en:
      cart_items_count: "{count, plural, =0 {Empty cart} =1 {1 item} other {# items}}"

    # NB: arabe a 6 formes de pluriel (zero, one, two, few, many, other) vs FR/EN qui ont 2-3 formes.

  # ICU select (gender/category)
  select_examples:
    fr:
      welcome_user: "{gender, select, female {Bienvenue} male {Bienvenu} other {Bienvenue}} {name} !"
    en:
      welcome_user: "Welcome {name}!"

  # ICU number formatting
  number_examples:
    fr:
      price: "À partir de {price, number, ::currency/MAD}"          # → "À partir de 299,00 MAD"
      large_number: "{count, number, ::compact-short}"               # → "1,2k"
      percentage: "{value, number, ::percent}"                       # → "85 %"
    ar:
      price: "ابتداء من {price, number, ::currency/MAD}"
      large_number: "{count, number, ::compact-short}"
    en:
      price: "From {price, number, ::currency/MAD}"
      large_number: "{count, number, ::compact-short}"               # → "1.2K"
      percentage: "{value, number, ::percent}"                       # → "85%"

  # ICU date formatting
  date_examples:
    fr:
      published_at: "Publié le {date, date, long}"                  # → "Publié le 27 mai 2026"
      time_ago: "{date, relative}"                                  # → "il y a 2 jours"
    ar:
      published_at: "نُشر في {date, date, long}"
      time_ago: "{date, relative}"
    en:
      published_at: "Published on {date, date, long}"               # → "Published on May 27, 2026"
      time_ago: "{date, relative}"                                  # → "2 days ago"

  # Rich text (HTML safe via next-intl t.rich)
  rich_text_examples:
    fr:
      hero_description: |
        Le rituel <bold>ongles</bold> en cinq minutes.
        <italic>Pour vous.</italic>
    ar:
      hero_description: |
        طقوس <bold>الأظافر</bold> في خمس دقائق.
        <italic>لك.</italic>

# ============================================================================
# 6. ANTI-PATTERNS À ÉVITER
# ============================================================================

anti_patterns:

  - description: "Clé hardcodée non extraite"
    bad: |
      // src/app/page.tsx
      <h1>Le rituel ongles, en cinq minutes.</h1>
    good: |
      const t = useTranslations('marketing.hero');
      <h1>{t('title')}</h1>

  - description: "Concaténation au lieu d'interpolation"
    bad: |
      const greeting = t('hello') + ' ' + name + '!';
    good: |
      // messages/fr.json: "hello_user": "Bonjour {name} !"
      const greeting = t('hello_user', { name });

  - description: "Pluriel via if/else au lieu d'ICU"
    bad: |
      const text = count === 0 ? 'Aucun' : count === 1 ? '1 article' : `${count} articles`;
    good: |
      // messages/fr.json: "items_count": "{count, plural, =0 {Aucun} =1 {1 article} other {# articles}}"
      const text = t('items_count', { count });

  - description: "Langue dans la clé"
    bad: |
      "hero_title_fr": "Le rituel"
      "hero_title_ar": "الطقوس"
    good: |
      // messages/fr.json
      "marketing.hero.title": "Le rituel"
      // messages/ar.json
      "marketing.hero.title": "الطقوس"

  - description: "Trop plat ou trop profond"
    bad_too_flat: |
      "marketing_kit_hero_title": "..."
    bad_too_deep: |
      "marketing.pages.kit.sections.hero.elements.title.value": "..."
    good: |
      "marketing.kit.hero_title": "..."

# ============================================================================
# 7. CHECKLIST AVANT MERGE
# ============================================================================

merge_checklist:
  - "[ ] Toutes les clés FR sont définies"
  - "[ ] Schema JSON validé (pnpm i18n:validate-schema)"
  - "[ ] Aucune string hardcoded en JSX (eslint i18n/no-hardcoded passes)"
  - "[ ] Clés cohérentes avec naming-conventions.md"
  - "[ ] Tests vitest passent (snapshot inclus)"
  - "[ ] Playwright @smoke passes (i18n flows)"
  - "[ ] Translator-friendly : _meta complété si update significatif"
  - "[ ] Pas de breaking key rename non documenté"

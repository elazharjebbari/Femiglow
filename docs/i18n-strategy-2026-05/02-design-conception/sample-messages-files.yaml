# Sample messages files — exemples concrets par locale
#
# Fichier YAML doc qui illustre la structure attendue pour messages/[locale].json.
# Référence : translation-keys-schema.json + naming-conventions.md
# Lecture : 10 min — pour copy-paste rapide et illustration des patterns.

# ============================================================================
# 1. STRUCTURE MINIMALE — messages/fr.json (locale par défaut)
# ============================================================================

fr_minimal_example:
  _description: |
    Exemple minimal d'un fichier messages/fr.json fonctionnel.
    Couvre les namespaces obligatoires (common, navigation) + 1-2 sections marketing.

  content:
    $schema: "../docs/i18n-strategy-2026-05/02-design-conception/translation-keys-schema.json"
    _meta:
      locale: "fr"
      completeness_pct: 100
      last_reviewed_by: "founder@femiglow.local"
      last_reviewed_at: "2026-05-27T14:30:00Z"
      translator_notes: "Locale source — référence canonique"

    common:
      back: "Retour"
      continue: "Continuer"
      cancel: "Annuler"
      save: "Enregistrer"
      loading: "Chargement…"
      error: "Une erreur s'est produite"
      required: "Champ requis"
      optional: "Optionnel"
      yes: "Oui"
      no: "Non"
      confirm: "Confirmer"
      close: "Fermer"

    navigation:
      home: "Accueil"
      kit: "Le kit"
      maison: "Maison FemiGlow"
      rituel: "Le rituel"
      journal: "Journal"
      contact: "Contact"
      legal_menu: "Mentions"

    marketing:
      hero:
        title: "Le rituel ongles, en cinq minutes."
        subtitle: "Trois gestes, une saison."
        cta_primary: "Découvrir le kit"

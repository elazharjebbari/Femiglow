# FemiGlow Chat — Design Tokens (source unique)
# Generated → tailwind.config.ts via `pnpm tokens:gen`
# Modifications : voir 05-design-ui/README.md (gouvernance)

meta:
  version: "2026.05.13-v1"
  brand: FemiGlow
  scope: chat-v2-user-and-admin

# ─────────────────────────────────────────────────────────
# Color
# ─────────────────────────────────────────────────────────
color:
  # Primary — Violet maison
  primary:
    50:  "#FAF5FF"
    100: "#F3E8FF"
    200: "#E9D5FF"
    300: "#D8B4FE"
    400: "#C084FC"
    500: "#A855F7"
    600: "#9333EA"    # boutons par défaut
    700: "#7E22CE"    # hover/focus
    800: "#6B21A8"
    900: "#581C87"

  # Brand accent — Rose poudré
  accent:
    50:  "#FDF2F8"
    100: "#FCE7F3"
    200: "#FBCFE8"
    300: "#F9A8D4"
    400: "#F472B6"
    500: "#EC4899"
    600: "#DB2777"
    700: "#BE185D"

  # Neutrals
  neutral:
    0:   "#FFFFFF"
    50:  "#FAFAFA"
    100: "#F5F5F5"
    200: "#E5E5E5"
    300: "#D4D4D4"
    400: "#A3A3A3"
    500: "#737373"
    600: "#525252"
    700: "#404040"
    800: "#262626"
    900: "#171717"
    1000: "#000000"

  # Semantic
  success:
    50:  "#F0FDF4"
    500: "#22C55E"
    700: "#15803D"
  warning:
    50:  "#FFFBEB"
    500: "#F59E0B"
    700: "#B45309"
  error:
    50:  "#FEF2F2"
    500: "#EF4444"
    700: "#B91C1C"
  info:
    50:  "#EFF6FF"
    500: "#3B82F6"
    700: "#1D4ED8"

  # Surface alias (sémantique vs raw)
  surface:
    background: "{color.neutral.0}"
    backgroundSoft: "{color.primary.50}"     # panel chat
    foreground: "{color.neutral.900}"
    foregroundMuted: "{color.neutral.500}"
    border: "{color.neutral.200}"
    borderStrong: "{color.neutral.300}"
    bubbleUser: "{color.primary.600}"
    bubbleUserText: "{color.neutral.0}"
    bubbleAssistant: "{color.neutral.50}"
    bubbleAssistantText: "{color.neutral.900}"
    bubbleCanned: "{color.accent.50}"
    bubbleCannedBorder: "{color.accent.200}"
    overlay: "rgba(0,0,0,0.4)"

  # Dark mode (futur — pas Wave V5)
  dark:
    surface:
      background: "{color.neutral.900}"
      foreground: "{color.neutral.50}"
      bubbleAssistant: "{color.neutral.800}"

# ─────────────────────────────────────────────────────────
# Typography
# ─────────────────────────────────────────────────────────
typography:
  fontFamily:
    sans: "Inter, system-ui, -apple-system, 'Segoe UI', sans-serif"
    arabic: "'Noto Sans Arabic', 'Cairo', 'Tahoma', sans-serif"
    mono: "ui-monospace, 'SF Mono', Monaco, monospace"

  fontSize:
    xs:   "0.75rem"   # 12px — captions
    sm:   "0.875rem"  # 14px — body small / metadata
    base: "1rem"      # 16px — body
    lg:   "1.125rem"  # 18px — bubble large?
    xl:   "1.25rem"   # 20px — section titles
    "2xl": "1.5rem"   # 24px — chat header
    "3xl": "1.875rem" # 30px — admin titles
    "4xl": "2.25rem"

  fontWeight:
    regular: 400
    medium: 500
    semibold: 600
    bold: 700

  lineHeight:
    tight: 1.2
    snug: 1.35
    normal: 1.5
    relaxed: 1.625

  letterSpacing:
    tight: "-0.01em"
    normal: "0"
    wide: "0.02em"

# ─────────────────────────────────────────────────────────
# Spacing (4px base)
# ─────────────────────────────────────────────────────────
spacing:
  0: "0"
  0.5: "0.125rem"   # 2px
  1: "0.25rem"      # 4px
  2: "0.5rem"       # 8px
  3: "0.75rem"      # 12px
  4: "1rem"         # 16px
  5: "1.25rem"      # 20px
  6: "1.5rem"       # 24px
  8: "2rem"         # 32px
  10: "2.5rem"      # 40px
  12: "3rem"        # 48px
  16: "4rem"        # 64px
  20: "5rem"        # 80px

# ─────────────────────────────────────────────────────────
# Border radius
# ─────────────────────────────────────────────────────────
radius:
  none: "0"
  xs:   "4px"
  sm:   "6px"
  md:   "8px"
  lg:   "12px"
  xl:   "16px"
  "2xl": "20px"     # bulles chat
  "3xl": "28px"     # panel chat (mobile sheet)
  full: "9999px"

# ─────────────────────────────────────────────────────────
# Shadows
# ─────────────────────────────────────────────────────────
shadow:
  xs: "0 1px 2px rgba(15, 23, 42, 0.06)"
  sm: "0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04)"
  md: "0 4px 6px rgba(15, 23, 42, 0.07), 0 2px 4px rgba(15, 23, 42, 0.05)"
  lg: "0 10px 20px rgba(15, 23, 42, 0.08), 0 4px 6px rgba(15, 23, 42, 0.05)"
  xl: "0 20px 40px rgba(15, 23, 42, 0.10), 0 8px 16px rgba(15, 23, 42, 0.05)"
  "2xl": "0 25px 60px rgba(107, 70, 193, 0.18)"   # chat panel ouvert
  ring: "0 0 0 2px {color.primary.600}"            # focus
  ringSoft: "0 0 0 4px {color.primary.100}"        # focus + halo

# ─────────────────────────────────────────────────────────
# Z-index
# ─────────────────────────────────────────────────────────
zIndex:
  base: 0
  raised: 10
  sticky: 20
  banner: 30
  dropdown: 40
  overlay: 50
  modal: 60
  popover: 70
  tooltip: 80
  toast: 90
  launcher: 95
  panel: 100
  panelOverlay: 99

# ─────────────────────────────────────────────────────────
# Breakpoints (mobile-first)
# ─────────────────────────────────────────────────────────
breakpoint:
  xs: "360px"       # iPhone SE
  sm: "480px"       # phablet
  md: "768px"       # tablet
  lg: "1024px"      # desktop small
  xl: "1280px"      # desktop
  "2xl": "1536px"   # large monitor

# ─────────────────────────────────────────────────────────
# Sizes (chat panel)
# ─────────────────────────────────────────────────────────
size:
  panel:
    width:
      mobile: "100vw"
      tablet: "420px"
      desktop: "400px"
    height:
      mobile: "92vh"      # laisse 8% en haut pour close gesture
      tablet: "640px"
      desktop: "640px"
    maxHeight: "92vh"
    minHeight: "480px"
  launcher:
    desktop: "56px"
    mobile: "52px"
  composer:
    minHeight: "44px"
    maxHeight: "120px"      # 5 lignes max avant scroll
  hitTarget:
    min: "44px"             # WCAG 2.5.5 (AAA), iOS HIG

# ─────────────────────────────────────────────────────────
# Motion (lié à 04-frontend/animations.hjson)
# ─────────────────────────────────────────────────────────
motion:
  duration:
    instant: 0
    micro: 80
    short: 150
    medium: 250
    long: 400
    xlong: 650
  easing:
    standard: "cubic-bezier(0.4, 0, 0.2, 1)"
    feminine: "cubic-bezier(0.34, 1.16, 0.64, 1)"

# ─────────────────────────────────────────────────────────
# Component-level overrides (rare, à éviter)
# ─────────────────────────────────────────────────────────
component:
  bubble:
    user:
      bg: "{color.surface.bubbleUser}"
      text: "{color.surface.bubbleUserText}"
      radius: "{radius.2xl}"
      maxWidth: "78%"
      padding: "10px 14px"
    assistant:
      bg: "{color.surface.bubbleAssistant}"
      text: "{color.surface.bubbleAssistantText}"
      radius: "{radius.2xl}"
      maxWidth: "92%"
      padding: "12px 16px"
    canned:
      bg: "{color.surface.bubbleCanned}"
      borderColor: "{color.surface.bubbleCannedBorder}"
      borderWidth: "1px"
  pill:
    bg: "{color.neutral.0}"
    border: "{color.neutral.200}"
    text: "{color.neutral.800}"
    hoverBg: "{color.primary.50}"
    hoverBorder: "{color.primary.200}"
    radius: "{radius.full}"
    padding: "8px 14px"
    fontSize: "{typography.fontSize.sm}"
    fontWeight: "{typography.fontWeight.medium}"
    minHeight: "{size.hitTarget.min}"

# =========================================================================
# Risk Matrix
# =========================================================================
risks:
  - id: R-01
    description: Higgsfield API response format differs from assumed structure
    probability: medium
    impact: high
    mitigation: MSW mocks isolate tests; adapter normalizes response
    affected_points: [IP-07]

  - id: R-02
    description: Video generation exceeds 6-minute polling timeout
    probability: medium
    impact: medium
    mitigation: Timeout is configurable; ProviderError is retryable
    affected_points: [IP-07, NR-02]

  - id: R-03
    description: Regression on existing OpenAI image generation path
    probability: low
    impact: high
    mitigation: Preserve existing code paths; comprehensive unit tests
    affected_points: [NR-01]

  - id: R-04
    description: Rate limiting (429) during key validation
    probability: medium
    impact: low
    mitigation: 429 treated as "valid key, just rate limited"
    affected_points: [IP-05]

  - id: R-05
    description: Circular dependency in provider config builder
    probability: low
    impact: medium
    mitigation: Isolate builder function; avoid importing from nodes
    affected_points: [NR-01, NR-02]

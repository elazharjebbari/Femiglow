  # ═══════════════════════════════════════════════════════════════════════
  # PROVIDER LISTING
  # File: src/app/api/admin/ai-engine/config/providers/__tests__/route.test.ts
  # ═══════════════════════════════════════════════════════════════════════

  - id: HF-SVC-060
    name: "GET /providers includes Higgsfield in default providers list"
    type: unit
    priority: P0
    file: providers-route.test.ts
    setup: "No DB providers (uses getDefaultProviders fallback)"
    assertions:
      - "response.providers includes entry with providerType='higgsfield'"
      - "entry.name === 'Higgsfield AI'"
      - "entry.capabilities === ['image', 'video']"
      - "entry.priority === 15"

  - id: HF-SVC-061
    name: "GET /providers sets configured=true when AI_ENGINE_HIGGSFIELD_API_KEY is set"
    type: unit
    priority: P0
    file: providers-route.test.ts
    setup: "AI_ENGINE_HIGGSFIELD_API_KEY = 'hf-key'"
    assertions:
      - "higgsfield entry.configured === true"

  - id: HF-SVC-062
    name: "GET /providers sets configured=false when AI_ENGINE_HIGGSFIELD_API_KEY is absent"
    type: unit
    priority: P0
    file: providers-route.test.ts
    setup: "AI_ENGINE_HIGGSFIELD_API_KEY not set"
    assertions:
      - "higgsfield entry.configured === false"

  - id: HF-SVC-063
    name: "GET /providers/models?provider=higgsfield returns static models"
    type: unit
    priority: P0
    file: providers-models-route.test.ts
    assertions:
      - "response.models includes 'higgsfield-diffusion-v2'"
      - "response.models includes 'higgsfield-video-v1'"
      - "response.source === 'fallback'"

  - id: HF-SVC-064
    name: "GET /providers/models?provider=higgsfield&capability=image filters to image models"
    type: unit
    priority: P1
    file: providers-models-route.test.ts
    assertions:
      - "all returned models have role 'image'"
      - "no video models in response"

  - id: HF-SVC-065
    name: "GET /providers/models?provider=higgsfield&capability=video filters to video models"
    type: unit
    priority: P1
    file: providers-models-route.test.ts
    assertions:
      - "all returned models have role 'video'"
      - "no image models in response"


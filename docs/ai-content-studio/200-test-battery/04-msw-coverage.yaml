      success:
        name: aiEngineStreamHandlers.success
        status: missing
        returns: "SSE events: {event: 'phase', data: {name, progress, status}}"
        http_status: 200
        content_type: text/event-stream
      error_stream:
        name: aiEngineStreamHandlers.error
        status: missing
        returns: "SSE event: {event: 'error', data: {code, message}}"
        http_status: 200
        content_type: text/event-stream
      error_500:
        name: aiEngineStreamHandlers.server_error
        status: missing
        returns: "{error: 'Internal server error'}"
        http_status: 500
    tested_by: [contract, e2e]
    contract_file: ai-engine-stream.contract.test.ts

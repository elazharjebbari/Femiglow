# AI Engine -- MSW Handler Coverage Inventory
# Last updated: 2026-05-27
#
# This file maps every AI Engine API route to its MSW handler(s).
# Handler source: src/test/msw/ai-engine-handlers.ts
#
# Status legend:
#   exists   - handler is implemented and exported
#   missing  - handler needs to be created
#   partial  - success handler exists but error variants are missing

handler_source: src/test/msw/ai-engine-handlers.ts
base_path: /api/admin/ai-engine
total_routes: 24
total_handlers_existing: 29
total_handlers_needed: 53

routes:

  # ============================================================
  # GENERATION
  # ============================================================

  - path: POST /api/admin/ai-engine/generate
    description: Run the full LangGraph content generation pipeline
    handlers:
      success:
        name: aiEngineHandlers[0]
        export: aiEngineHandlers
        status: exists
        returns: MOCK_GENERATION_RESULT (jobId, status, script, caption, hashtags, images, qualityScores, costTracking)
        http_status: 200
      error_500:
        name: aiEngineErrorHandlers.generate500
        export: aiEngineErrorHandlers
        status: exists
        returns: "{error: {code: 'internal_error', message: 'Provider timeout'}}"
        http_status: 500
      error_429:
        name: aiEngineErrorHandlers.generate429
        export: aiEngineErrorHandlers
        status: exists
        returns: "{error: {code: 'rate_limited', message: 'Budget quotidien depasse'}}"
        http_status: 429
      error_401:
        name: aiEngineErrorHandlers.generate401
        status: missing
        returns: "{error: {code: 'unauthorized', message: 'Session expired'}}"
        http_status: 401
      error_422:
        name: aiEngineErrorHandlers.generate422
        status: missing
        returns: "{error: {code: 'validation_error', message: 'Missing required field: platform'}}"
        http_status: 422
    tested_by: [contract, e2e]
    contract_file: ai-engine-generate.contract.test.ts
    e2e_files: [ai-engine-create.spec.ts, ai-engine-scenario-golden-path.spec.ts]

  - path: POST /api/admin/ai-engine/generate-stream
    description: SSE streaming generation with real-time progress events

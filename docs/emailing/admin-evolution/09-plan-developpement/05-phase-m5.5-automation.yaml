    title: "Test ultime M5.5"
    description: |
      E2E : créer automation post-purchase upsell complète, déclencher, vérifier.
    estimate_days: 1
    tests:
      - playwright: "11-tests/03-playwright-e2e/05-m5.5-ultimate.spec.md"
    deliverable: "Test passe"

gate_exit_criteria:
  - "Tous step kinds testés isolément"
  - "Branch eval correct sur condition fixe et user-dépendante"
  - "Cooldown + quiet hours respectés"
  - "Test ultime passe"

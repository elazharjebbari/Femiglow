    deliverable: "Composants"

  - id: M5.5.10
    title: "Composant AutomationWizard + StepList"
    description: |
      5 steps + step list récursive (branches).
    estimate_days: 1.5
    tests:
      - jest: "11-tests/01-jest-unit/automation-wizard.test.spec.md"
    deliverable: "Composants"

  - id: M5.5.11
    title: "Pages automation"
    description: |
      /new (wizard), /[id]/edit, /runs/[id].
    estimate_days: 1
    tests:
      - playwright: "11-tests/03-playwright-e2e/automation-create.spec.md"
    deliverable: "3 pages"


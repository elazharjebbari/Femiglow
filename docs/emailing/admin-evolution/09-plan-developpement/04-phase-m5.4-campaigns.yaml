    estimate_days: 1.5
    docs:
      - "../02-backend/05-listmonk-sync.md"
    tests:
      - msw: "11-tests/02-msw-integration/listmonk-sync.test.spec.md"
    deliverable: "lib/mail/campaigns/listmonk-sync.ts"

  - id: M5.4.2
    title: "finalizeCampaign V2 — snapshot + push"

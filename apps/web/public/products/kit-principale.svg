<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Le rituel FemiGlow — flacon de base, fortifiant et lime, sur fond crème">
  <rect width="1600" height="2000" fill="#FBF8F1"/>
  <ellipse cx="800" cy="1700" rx="600" ry="40" fill="#2C2A28" opacity="0.06"/>

  <!-- Flacon de base -->
  <g transform="translate(540 760)">
    <rect x="-90" y="0" width="180" height="380" rx="14" fill="#C5DBC4"/>
    <rect x="-50" y="-60" width="100" height="80" rx="6" fill="#2C2A28" opacity="0.85"/>
    <rect x="-90" y="220" width="180" height="80" fill="#FBF8F1" opacity="0.4"/>
  </g>

  <!-- Flacon fortifiant -->
  <g transform="translate(800 720)">
    <rect x="-95" y="0" width="190" height="430" rx="14" fill="#F2CECC"/>
    <rect x="-52" y="-70" width="104" height="90" rx="6" fill="#2C2A28" opacity="0.85"/>
    <rect x="-95" y="240" width="190" height="100" fill="#FBF8F1" opacity="0.45"/>
  </g>

  <!-- Lime -->
  <g transform="translate(1060 800) rotate(8)">
    <rect x="-25" y="0" width="50" height="350" rx="6" fill="#C8A876"/>
    <rect x="-25" y="0" width="50" height="40" fill="#2C2A28" opacity="0.7"/>
  </g>

  <text x="800" y="1900" text-anchor="middle" font-family="Georgia, serif" font-size="32" letter-spacing="8" fill="#2C2A28" opacity="0.5">LE RITUEL · FEMIGLOW</text>
</svg>

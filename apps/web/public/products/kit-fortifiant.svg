<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img" aria-label="Flacon doseur de fortifiant FemiGlow, verre teinté pétale, capuchon champagne">
  <defs>
    <linearGradient id="bg-fort" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#F2DFD0"/>
    </linearGradient>
    <linearGradient id="glass-fort" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2CECC" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F8DDDA"/>
      <stop offset="100%" stop-color="#D9A9A6" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cap-fort" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9B98A"/>
      <stop offset="100%" stop-color="#A88652"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg-fort)"/>
  <ellipse cx="600" cy="1280" rx="220" ry="20" fill="#2C2A28" opacity="0.08"/>
  <g transform="translate(600 1260)">
    <rect x="-130" y="-540" width="260" height="540" rx="18" fill="url(#glass-fort)"/>
    <rect x="-130" y="-280" width="260" height="100" fill="#FBF8F1" opacity="0.32"/>
    <rect x="-120" y="-520" width="240" height="36" rx="5" fill="#FBF8F1" opacity="0.4"/>
    <rect x="-72" y="-640" width="144" height="100" rx="9" fill="url(#cap-fort)"/>
    <rect x="-30" y="-740" width="60" height="100" rx="6" fill="url(#cap-fort)"/>
    <line x1="0" y1="-540" x2="0" y2="-740" stroke="#2C2A28" stroke-width="2" opacity="0.35"/>
    <rect x="-90" y="-240" width="180" height="140" fill="#FBF8F1" opacity="0.55"/>
    <text x="0" y="-180" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="26" fill="#2C2A28" opacity="0.75">le fortifiant</text>
    <text x="0" y="-140" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="2.5" fill="#2C2A28" opacity="0.55">FEMIGLOW · 10 ML</text>
  </g>
  <text x="600" y="1430" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" letter-spacing="3.5" fill="#2C2A28" opacity="0.4">FORTIFIANT</text>
</svg>

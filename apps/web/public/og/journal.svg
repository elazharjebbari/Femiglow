<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Le carnet de la maison FemiGlow">
  <defs>
    <linearGradient id="bg-journal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#F2E6D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-journal)"/>
  <g transform="translate(600 312)">
    <line x1="-80" y1="0" x2="-30" y2="0" stroke="#C8A876" stroke-width="0.8"/>
    <line x1="30" y1="0" x2="80" y2="0" stroke="#C8A876" stroke-width="0.8"/>

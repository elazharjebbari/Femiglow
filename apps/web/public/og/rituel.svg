<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Le rituel FemiGlow — quatre gestes, une méthode lente">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF8F1"/>
      <stop offset="100%" stop-color="#E0EDE0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g fill="none" stroke="#4F6D52" stroke-width="0.8" opacity="0.4">
    <path d="M-50 500 C 240 440, 520 560, 820 480 S 1240 400, 1300 460"/>
    <path d="M-50 540 C 280 480, 540 600, 860 520 S 1240 440, 1300 500"/>
  </g>
  <g transform="translate(600 240)" text-anchor="middle">
    <text font-family="Inter, sans-serif" font-size="16" letter-spacing="4" fill="#7A5F38">LE RITUEL</text>
    <text y="80" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="76" fill="#2C2A28" font-weight="500">Le rituel,</text>
    <text y="160" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="76" fill="#2C2A28" font-weight="500">geste après geste.</text>
    <text y="230" font-family="Inter, sans-serif" font-size="20" fill="#2C2A28" opacity="0.7">Une méthode lente, racontée à Casablanca.</text>
  </g>
  <g transform="translate(600 510)" stroke="#7A5F38" stroke-width="0.6" fill="none" opacity="0.5">
    <line x1="-90" y1="0" x2="-15" y2="0"/>
    <path d="M0 -10 C -10 -5, -10 5, 0 10 C 10 5, 10 -5, 0 -10 Z"/>
    <line x1="15" y1="0" x2="90" y2="0"/>
  </g>
</svg>

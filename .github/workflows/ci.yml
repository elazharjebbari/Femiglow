name: CI

on:
  push:
    branches: [master, main, studio/integration]
  pull_request:
    branches: [master, main, studio/integration]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate migrations
        run: node apps/web/scripts/_validate-migrations.mjs --strict

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests vitest
        run: pnpm -r test
        env:
          ADMIN_SESSION_PASSWORD: ${{ secrets.CI_ADMIN_SESSION_PASSWORD || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
          WEBHOOK_SECRET_KEY: ${{ secrets.CI_WEBHOOK_SECRET_KEY || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
          CRON_SECRET: ${{ secrets.CI_CRON_SECRET || 'cccccccccccccccccccccccccccccccc' }}

      - name: Content Studio unit + integration tests
        # vitest est installé dans apps/web (workspace) ; lancer depuis la racine
        # donne « vitest: not found » (exit 127). On exécute donc dans apps/web
        # avec des chemins relatifs. (Redondant avec `pnpm -r test`, conservé par
        # prudence pour le scope env dédié.)
        run: npx vitest run src/lib/content-studio/ src/lib/content-studio-v2/ src/components/admin/content-studio/ src/components/admin/content-studio-v2/ src/test/msw/
        working-directory: apps/web
        env:
          ADMIN_SESSION_PASSWORD: ${{ secrets.CI_ADMIN_SESSION_PASSWORD || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}

  e2e:
    name: Playwright E2E — suite studio (DB-assertive)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # Postgres éphémère (pgvector requis par les migrations chat) : sans vraie
    # DB le serveur retombe en memoryStore → la session admin ne persiste pas
    # et les specs social-publishing (assertions SQL directes) ne peuvent pas
    # tourner. Pattern repris de la CI master (ci-e2e-postgres-2026-05-30).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: femiglow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Env au niveau job → hérité par build, migrate ET le webServer Playwright.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/femiglow_test
      ADMIN_SESSION_PASSWORD: ${{ secrets.CI_ADMIN_SESSION_PASSWORD || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
      WEBHOOK_SECRET_KEY: ${{ secrets.CI_WEBHOOK_SECRET_KEY || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
      CRON_SECRET: ${{ secrets.CI_CRON_SECRET || 'cccccccccccccccccccccccccccccccc' }}
      ADMIN_BOOTSTRAP_EMAIL: admin@femiglow.local
      ADMIN_BOOTSTRAP_PASSWORD: admin-test-pass
      CONTENT_STUDIO_ENABLED: 'true'
      CONTENT_STUDIO_V2_ENABLED: 'true'
      CONTENT_STUDIO_V2_DEFAULT: 'true'
      CONTENT_STUDIO_MEDIA_STUDIO_ENABLED: 'true'
      # Génération : provider mock (déterministe, aucun appel externe) ; le
      # texte tombe déjà en fallback déterministe sans clé OpenAI.
      CONTENT_STUDIO_IMAGE_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Apply DB migrations
        # Runner maison (hash-based, idempotent) — `drizzle-kit migrate` wrappe
        # chaque migration dans une transaction et casse CREATE EXTENSION.
        run: node scripts/_migrate-safe.mjs
        working-directory: apps/web

      - name: Build Next.js
        run: pnpm --filter web build

      - name: Run studio E2E (publication DB-assertive + create flow)
        # Suite ciblée et stable : les specs social-publishing sont les seules
        # à vérifier les écritures Postgres réelles du pipeline de publication
        # (audit 2026-06-10 §04 : elles ne tournaient jamais en CI → rot).
        # La suite complète reste exécutable à la main (npx playwright test).
        # CS_E2E_SKIP_AI_ENGINE : quarantaine des specs ai-engine-* (battery
        # spéculative du 25/05, ~60 échecs déterministes d'UI drift mesurés le
        # 2026-06-11) — voir playwright.config.ts.
        run: >-
          npx playwright test
          content-studio.spec.ts
          content-studio-approval-gate.spec.ts
          content-studio-social-publishing.spec.ts
          content-studio-social-publishing-draft.spec.ts
          e2e/social-publishing/video-publish-end-to-end.spec.ts
          e2e/content-studio-v2/
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          CS_E2E_SKIP_AI_ENGINE: 'true'

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-studio
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  i18n:
    name: i18n E2E (couverture traductions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # NON-BLOQUANT : gate de COUVERTURE i18n pour le feature en cours (le
    # ConsentBanner + quelques composants ne sont pas encore traduits). On
    # garde le signal sans bloquer le merge. TODO: retirer `continue-on-error`
    # quand la traduction intégrale est finie (cf. finalisation i18n).
    continue-on-error: true
    # Postgres éphémère : `global.setup` s'authentifie en admin → sans vraie DB
    # la session ne persiste pas (memoryStore) → `page.waitForURL` timeout.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: femiglow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Env au niveau job → hérité par build, migrate ET le webServer Playwright.
    # `NEXT_PUBLIC_*` sont inlinés au build ; `I18N_ENABLED` relu au runtime.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/femiglow_test
      ADMIN_SESSION_PASSWORD: ${{ secrets.CI_ADMIN_SESSION_PASSWORD || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
      WEBHOOK_SECRET_KEY: ${{ secrets.CI_WEBHOOK_SECRET_KEY || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
      CRON_SECRET: ${{ secrets.CI_CRON_SECRET || 'cccccccccccccccccccccccccccccccc' }}
      ADMIN_BOOTSTRAP_EMAIL: admin@femiglow.local
      ADMIN_BOOTSTRAP_PASSWORD: admin-test-pass
      I18N_ENABLED: 'true'
      NEXT_PUBLIC_I18N_ENABLED: 'true'
      NEXT_PUBLIC_LOCALE_SWITCHER_V2: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      - name: Apply DB migrations
        run: node scripts/_migrate-safe.mjs
        working-directory: apps/web

      - name: Build Next.js (i18n on)
        run: pnpm --filter web build

      - name: Run i18n full-translation E2E
        run: npx playwright test i18n/full-translation.spec.ts
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

      - name: Upload Playwright artifacts (i18n)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-i18n
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

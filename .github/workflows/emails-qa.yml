name: Emails QA

# ──────────────────────────────────────────────────────────────────────────
# Batterie QA emailing (campagne 2026-06). Découplée de `ci.yml` : elle ne se
# déclenche QUE sur les PR touchant le périmètre email (lib/mail, composants
# admin emails, routes mail / cron outbox / admin emails). Trois étages :
#   - unit-component : pas de DB (vitest pur + MSW) — feedback rapide.
#   - integration    : Postgres 16 éphémère + migrations + suites vraie-DB.
#   - e2e (nightly)  : Playwright + Mailpit, schedule séparé (cf. job `e2e`).
#
# Le périmètre des `paths` est volontairement aligné sur les fichiers que la
# campagne durcit ; un changement hors-périmètre ne paye pas le coût de cette
# matrice (la CI globale `ci.yml` reste la gate de fond).
# ──────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/mail/**'
      - 'apps/web/src/components/admin/emails/**'
      - 'apps/web/src/app/api/mail/**'
      - 'apps/web/src/app/api/cron/email-outbox/**'
      - 'apps/web/src/app/api/cron/email-automation/**'
      - 'apps/web/src/app/admin/emails/**'
      - 'apps/web/src/app/api/admin/emails/**'
      - 'apps/web/src/app/api/listmonk/**'
      - 'apps/web/src/lib/admin/emails/**'
      - 'apps/web/src/test/msw/emails-handlers.ts'
      - 'apps/web/src/test/msw/emails-contracts.conformity.test.ts'
      - 'apps/web/src/test/factories/emails.factory.ts'
      - 'apps/web/src/test/db/emails-db.ts'
      - 'apps/web/scripts/test-emails-integration.sh'
      - '.github/workflows/emails-qa.yml'

  # Permet un déclenchement manuel (re-run d'une PR, smoke local de la matrice).
  workflow_dispatch:

concurrency:
  group: emails-qa-${{ github.ref }}
  cancel-in-progress: true

# Secrets de test déterministes : valeurs factices stables (32 chars) si les
# secrets CI ne sont pas configurés. Identiques au pattern de `ci.yml` pour que
# les sessions admin / la vérif de signature webhook fonctionnent en test.
env:
  ADMIN_SESSION_PASSWORD: ${{ secrets.CI_ADMIN_SESSION_PASSWORD || 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' }}
  WEBHOOK_SECRET_KEY: ${{ secrets.CI_WEBHOOK_SECRET_KEY || 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb' }}
  CRON_SECRET: ${{ secrets.CI_CRON_SECRET || 'cccccccccccccccccccccccccccccccc' }}

jobs:
  # ── (a) Unit + composant — AUCUNE DB ─────────────────────────────────────
  # `test:emails:unit` + `test:emails:component`. Les suites vraie-DB importées
  # par ces globs se SKIPPENT honnêtement (describeEmailsDb : pas d'URL
  # femiglow_test → describe.skip), donc ce job ne nécessite pas de Postgres.
  unit-component:
    name: Unit + composant (sans DB, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # P0.1 emails-ux : la couche composant absorbera ~600 tests supplémentaires
    # (batteries F01..F10) — sharding 2× dès maintenant pour garder le feedback
    # PR < 10 min. Le typecheck et l'unit ne tournent que sur le shard 1 (pas
    # de gain à les dupliquer).
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (apps/web)
        if: matrix.shard == '1/2'
        run: pnpm --filter web typecheck

      - name: Emails unit
        if: matrix.shard == '1/2'
        run: pnpm test:emails:unit
        working-directory: apps/web

      - name: Emails composant (MSW)
        # NB pnpm : PAS de `--` avant le flag (il serait transmis littéralement
        # à vitest qui l'avalerait comme filtre → shard ignoré, suite complète).
        run: pnpm test:emails:component --shard=${{ matrix.shard }}
        working-directory: apps/web

  # ── (a-bis) Build Next.js — gate RSC (P0.1 emails-ux) ─────────────────────
  # Les violations RSC ('use client' qui importe du server-only, export sync
  # dans un module 'use server') sont INVISIBLES à tsc ET à vitest — seul
  # `next build` les attrape (leçon campagne QA 2026-06). Job indépendant pour
  # paralléliser ; il gate le merge au même titre que les tests.
  build-rsc:
    name: Build Next.js (gate RSC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm --filter web build

  # ── (a-ter) Coverage emails — RAPPORT (P0.1 emails-ux) ────────────────────
  # Rapport d'observation publié en artifact à chaque PR du périmètre. Les
  # SEUILS bloquants (G3 : ui/ >= 85 %, G4 : écrans refondus >= 80 %) seront
  # armés en P1.1, quand components/admin/emails/ui/ existera — les armer
  # avant ferait échouer la CI sur un dossier vide.
  coverage:
    name: Coverage emails (rapport)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Coverage composants emails
        run: >-
          pnpm vitest run --coverage
          --coverage.include='src/components/admin/emails/**'
          --coverage.include='src/lib/mail/**'
          --coverage.include='src/lib/admin/emails/**'
          --coverage.reporter=text --coverage.reporter=json-summary
          src/components/admin/emails src/test/msw/emails-handlers.smoke.test.ts
          src/test/msw/emails-contracts.conformity.test.ts
        working-directory: apps/web

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emails-coverage
          path: apps/web/coverage/coverage-summary.json
          retention-days: 14

  # ── (b) Intégration — Postgres 16 éphémère ───────────────────────────────
  # Migrations via le runner maison (_migrate-safe.mjs, idempotent, pas de
  # transaction-wrapper) PUIS la batterie `test:emails:integration` (sérialisée,
  # --no-file-parallelism : suites vraie-DB sur la même base, cf. R-023).
  integration:
    name: Intégration (Postgres 16, vraie DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-component
    # pgvector/pgvector:pg16 : les migrations cœur du repo créent l'extension
    # vector (chat). Une image postgres:16 nue échouerait sur CREATE EXTENSION.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: femiglow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Le harnais emails-db.ts EXIGE une URL contenant `femiglow_test` (garde-fou
    # anti-prod) ; la lib applicative (db/client.ts) lit DATABASE_URL → les deux
    # variables convergent sur la même base de test.
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/femiglow_test
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/femiglow_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply DB migrations
        # Runner maison (lit DATABASE_URL de l'env du job). Idempotent (hash).
        run: node scripts/_migrate-safe.mjs
        working-directory: apps/web

      - name: Materialize .env.test for the integration runner
        # `scripts/test-emails-integration.sh` lance `node --env-file=.env.test`.
        # En CI il n'y a pas de .env.test → on l'écrit depuis l'env du job
        # (DATABASE_URL est la base éphémère femiglow_test). On NE met PAS de
        # secret applicatif ici : ils sont injectés par l'env du step ci-dessous.
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env.test
          printf 'DATABASE_URL_TEST=%s\n' "$DATABASE_URL_TEST" >> .env.test
        working-directory: apps/web

      - name: Emails integration
        run: bash scripts/test-emails-integration.sh
        working-directory: apps/web

# ── (c) E2E (nightly) — DOCUMENTÉ, activé via schedule séparé ──────────────
#
# Les E2E Playwright emailing (e2e/emails-*.spec.ts) ont besoin :
#   - d'un build Next.js + serveur lancé (webServer Playwright) ;
#   - de Mailpit (SMTP 1025 / API 8025) pour asserter l'envoi transactionnel ;
#   - d'une base de données isolée par run (PAS la prod — cf. note infra).
#
# Ils sont LENTS et plus flaky par nature : on ne les met PAS sur chaque PR. Le
# job ci-dessous est PRÊT mais commenté car il dépend d'un service Mailpit et
# (selon l'orga) de secrets non encore provisionnés en CI. Décommenter le bloc
# `on.schedule` + le job `e2e` une fois Mailpit câblé en service GitHub Actions.

name: Lighthouse

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lhci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @femiglow/web build
        env:
          NEXT_PUBLIC_ENV: production
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          ADMIN_SESSION_PASSWORD: lighthouse-ci-placeholder-32char-min!!
          WEBHOOK_SECRET_KEY: lighthouse-ci-placeholder-32char-min!!
          CRON_SECRET: lighthouse-ci-placeholder-cron

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/rituel
            http://localhost:3000/journal
            http://localhost:3000/contact
            http://localhost:3000/admin/login
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1

      # Kit CRO v2 §1 — landing publicitaire en conditions mobiles (preset
      # mobile, throttling simulé 4G lente). Config séparée : LHCI n'applique
      # qu'un seul jeu de réglages par collecte (le run ci-dessus est desktop).
      # Assertions en `warn` uniquement → n'échoue pas le job.
      - name: Run Lighthouse CI (mobile /kit)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.mobile-kit.json
          uploadArtifacts: true
          artifactName: lighthouse-results-mobile-kit
          temporaryPublicStorage: true
          runs: 3
